<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riverside General — AI Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #F3F6F4;
    --ink: #14302D;
    --ink-soft: #3E5651;
    --sage: #6F8F7C;
    --sage-dim: #DCE6DF;
    --amber: #C99A3F;
    --amber-dim: #F1E1BB;
    --coral: #DD6B4C;
    --coral-dim: #F8DED4;
    --cream: #FBF8F1;
    --line: #D7DED9;
    --shadow: 0 1px 2px rgba(20,48,45,0.06), 0 8px 24px rgba(20,48,45,0.05);
    --radius: 10px;
    --display: 'Fraunces', serif;
    --body: 'Public Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  *{ box-sizing: border-box; }
  html,body{ height: 100%; margin: 0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  ::selection{ background: var(--amber-dim); }
  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  /* ---------------- Header / ticket board ---------------- */
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 22px;
    background: var(--ink);
    color: var(--bg);
    border-bottom: 3px solid var(--amber);
  }
  .brand{
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark{
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.01em;
  }
  .brand .sub{
    font-size: 12px;
    color: var(--sage-dim);
    font-family: var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .ticket{
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(243,246,244,0.06);
    border: 1px solid rgba(243,246,244,0.18);
    border-radius: var(--radius);
    padding: 6px 14px;
  }
  .ticket-label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sage-dim);
  }
  .ticket-number{
    font-family: var(--display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--amber);
    display: inline-flex;
  }
  .ticket-number .digit{
    display: inline-block;
    min-width: 0.62em;
    animation: flip-in 320ms ease;
  }
  @keyframes flip-in{
    from{ transform: rotateX(90deg); opacity: 0; }
    to{ transform: rotateX(0deg); opacity: 1; }
  }

  .status-pill{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(111,143,124,0.18);
    color: var(--sage-dim);
    border: 1px solid rgba(111,143,124,0.4);
  }
  .status-dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--sage);
  }
  .status-pill.down .status-dot{ background: var(--coral); }
  .status-pill.down{ color: var(--coral-dim); border-color: rgba(221,107,76,0.5); background: rgba(221,107,76,0.14); }
  .status-pill.busy .status-dot{ background: var(--amber); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 50%{ opacity: 0.35; } }

  /* ---------------- Layout ---------------- */
  .layout{
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 0;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
    aside{ display: none; }
  }

  aside{
    background: var(--cream);
    border-right: 1px solid var(--line);
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
  }
  .panel-title{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-family: var(--mono);
  }
  .field input{
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink);
  }
  .divider{ height: 1px; background: var(--line); border: none; margin: 4px 0; }

  .btn{
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: var(--body);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .btn:hover{ background: var(--ink); color: var(--cream); }
  .btn.primary{
    background: var(--amber);
    border-color: var(--amber);
    color: #241a06;
  }
  .btn.primary:hover{ background: #b3872f; border-color: #b3872f; color: #241a06; }
  .btn.full{ width: 100%; }

  .routing-log{
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .routing-log .empty{ color: #93a39c; font-style: italic; }
  .routing-log .entry{
    padding: 7px 9px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
  }
  .routing-log .entry b{ color: var(--ink); }

  /* ---------------- Chat column ---------------- */
  main{
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .transcript{
    flex: 1;
    overflow-y: auto;
    padding: 26px 26px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row{ display: flex; }
  .row.user{ justify-content: flex-end; }
  .row.assistant{ justify-content: flex-start; }

  .bubble{
    max-width: 62%;
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: rise 220ms ease;
    position: relative;
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 700px){ .bubble{ max-width: 84%; } }

  .row.user .bubble{
    background: var(--cream);
    border: 1px solid var(--line);
    border-bottom-right-radius: 2px;
  }
  .row.assistant .bubble{
    background: var(--ink);
    color: var(--bg);
    border-bottom-left-radius: 2px;
    clip-path: polygon(
      0 0, 100% 0, 100% 100%, 0 100%,
      0 62%, 6px 58%, 0 54%
    );
    padding-left: 20px;
  }
  .row.assistant .bubble.blocked{
    background: var(--coral);
  }

  .meta{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    opacity: 0.65;
    margin-bottom: 4px;
    display: flex;
    gap: 8px;
  }
  .bubble-text{ white-space: pre-wrap; word-wrap: break-word; }

  .typing{
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .typing span{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--bg);
    opacity: 0.5;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform: translateY(0); opacity: 0.4;} 40%{ transform: translateY(-4px); opacity: 1;} }

  .composer{
    border-top: 1px solid var(--line);
    background: var(--cream);
    padding: 14px 26px 18px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .composer textarea{
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    font-family: var(--body);
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    min-height: 46px;
    max-height: 140px;
  }
  .send-btn{
    background: var(--amber);
    border: 1px solid var(--amber);
    color: #241a06;
    font-family: var(--body);
    font-weight: 700;
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .send-btn:disabled{
    opacity: 0.45;
    cursor: not-allowed;
  }
  .send-btn:not(:disabled):hover{ background: #b3872f; border-color: #b3872f; }

  .empty-state{
    margin: auto;
    text-align: center;
    color: var(--ink-soft);
    max-width: 380px;
    padding: 30px;
  }
  .empty-state .mark{
    font-family: var(--display);
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">Riverside General</span>
    <span class="sub">AI Front Desk</span>
  </div>

  <div style="display:flex; align-items:center; gap:14px;">
    <span id="statusPill" class="status-pill">
      <span class="status-dot"></span><span id="statusText">checking…</span>
    </span>
    <div class="ticket">
      <span class="ticket-label">Now Serving</span>
      <span class="ticket-number" id="ticketNumber">#000</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <div>
      <p class="panel-title">Session</p>
      <div class="field">
        <label for="userId">Patient ID (user_id)</label>
        <input id="userId" type="text" value="default_user" />
      </div>
      <div class="field">
        <label for="threadId">Thread ID</label>
        <input id="threadId" type="text" readonly />
      </div>
      <button class="btn full" id="newSessionBtn">New session — pull a fresh ticket</button>
    </div>

    <hr class="divider" />

    <div>
      <p class="panel-title">API endpoint</p>
      <div class="field">
        <label for="apiBase">Base URL</label>
        <input id="apiBase" type="text" value="http://127.0.0.1:5000" />
      </div>
      <button class="btn full" id="pingBtn">Check connection</button>
    </div>

    <hr class="divider" />

    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <p class="panel-title">Routing log</p>
      <div class="routing-log" id="routingLog" style="overflow-y:auto;">
        <div class="entry" style="text-align:center;">
          <span class="empty">Waiting for the first request…</span>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div class="transcript" id="transcript">
      <div class="empty-state" id="emptyState">
        <div class="mark">Welcome to the front desk.</div>
        <p>Ask about a doctor's availability, or book, reschedule, or cancel an appointment. Your supervisor agent will route you to the right desk.</p>
      </div>
    </div>

    <form class="composer" id="composerForm">
      <textarea id="messageInput" placeholder="e.g. Is Dr. Jane Smith available on 8 August 2026?" rows="1"></textarea>
      <button type="submit" class="send-btn" id="sendBtn">Send</button>
    </form>
  </main>
</div>

<script>
(function(){
  const transcript = document.getElementById('transcript');
  const emptyState = document.getElementById('emptyState');
  const composerForm = document.getElementById('composerForm');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const userIdInput = document.getElementById('userId');
  const threadIdInput = document.getElementById('threadId');
  const apiBaseInput = document.getElementById('apiBase');
  const newSessionBtn = document.getElementById('newSessionBtn');
  const pingBtn = document.getElementById('pingBtn');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const ticketNumberEl = document.getElementById('ticketNumber');
  const routingLog = document.getElementById('routingLog');

  function uuid(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function getApiBase(){
    return apiBaseInput.value.trim().replace(/\/$/, '');
  }

  function setTicketNumber(n){
    const padded = String(n).padStart(3, '0');
    ticketNumberEl.innerHTML = '#' + padded.split('').map(d => `<span class="digit">${d}</span>`).join('');
  }

  function nextTicketNumber(){
    let n = parseInt(localStorage.getItem('rg_ticket_seq') || '0', 10) + 1;
    localStorage.setItem('rg_ticket_seq', String(n));
    return n;
  }

  function startNewSession(){
    const tid = uuid();
    threadIdInput.value = tid;
    localStorage.setItem('rg_thread_id', tid);
    setTicketNumber(nextTicketNumber());
    transcript.innerHTML = '';
    transcript.appendChild(emptyState);
    routingLog.innerHTML = '<div class="entry" style="text-align:center;"><span class="empty">Waiting for the first request…</span></div>';
  }

  function logRoute(text){
    const first = routingLog.querySelector('.empty');
    if (first) routingLog.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'entry';
    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
    el.innerHTML = `<b>${time}</b><br/>${text}`;
    routingLog.prepend(el);
  }

  function addMessage(role, text, opts){
    opts = opts || {};
    if (emptyState.isConnected) emptyState.remove();

    const row = document.createElement('div');
    row.className = 'row ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.blocked ? ' blocked' : '');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = role === 'user' ? 'You' : (opts.blocked ? 'Front desk · blocked' : 'Front desk');

    const body = document.createElement('div');
    body.className = 'bubble-text';
    body.textContent = text;

    bubble.appendChild(meta);
    bubble.appendChild(body);
    row.appendChild(bubble);
    transcript.appendChild(row);
    transcript.scrollTop = transcript.scrollHeight;
    return bubble;
  }

  function addTypingBubble(){
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="bubble">
        <div class="meta">Front desk</div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;
    transcript.appendChild(row);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function removeTypingBubble(){
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function setStatus(state){
    statusPill.classList.remove('down', 'busy');
    if (state === 'up'){ statusText.textContent = 'connected'; }
    else if (state === 'down'){ statusPill.classList.add('down'); statusText.textContent = 'unreachable'; }
    else if (state === 'busy'){ statusPill.classList.add('busy'); statusText.textContent = 'processing…'; }
    else { statusText.textContent = 'checking…'; }
  }

  async function pingBackend(){
    setStatus('checking');
    try{
      const res = await fetch(getApiBase() + '/', { method: 'GET' });
      if (res.ok) setStatus('up'); else setStatus('down');
    }catch(e){
      setStatus('down');
    }
  }

  async function sendMessage(text){
    addMessage('user', text);
    addTypingBubble();
    sendBtn.disabled = true;
    setStatus('busy');

    try{
      const res = await fetch(getApiBase() + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          q: text,
          thread_id: threadIdInput.value,
          user_id: userIdInput.value || 'default_user',
        }),
      });

      const data = await res.json();
      removeTypingBubble();

      if (!res.ok){
        addMessage('assistant', 'The front desk hit an error reaching the server. Please try again.', {blocked: true});
        logRoute('<b>error</b> — HTTP ' + res.status);
        setStatus('down');
        return;
      }

      const isBlocked = data.status === 'blocked';
      const answer = data.answer || 'No response returned.';
      addMessage('assistant', answer, { blocked: isBlocked });

      if (isBlocked){
        logRoute(`<b>guardrails</b> — blocked before reaching the agent graph`);
      } else if (data.status === 'error'){
        logRoute(`<b>error</b> — ${data.answer ? 'internal failure' : 'unknown'}`);
      } else {
        logRoute(`<b>routed</b> — supervisor → worker → answered`);
      }

      setStatus('up');
    }catch(err){
      removeTypingBubble();
      addMessage('assistant', 'Could not reach the API. Check the base URL and that the server is running.', {blocked: true});
      logRoute('<b>network error</b> — ' + err.message);
      setStatus('down');
    }finally{
      sendBtn.disabled = false;
    }
  }

  composerForm.addEventListener('submit', function(e){
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;
    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendMessage(text);
  });

  messageInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      composerForm.requestSubmit();
    }
  });

  messageInput.addEventListener('input', function(){
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
  });

  newSessionBtn.addEventListener('click', startNewSession);
  pingBtn.addEventListener('click', pingBackend);

  // Init
  const savedThreadId = localStorage.getItem('rg_thread_id');
  if (savedThreadId){
    threadIdInput.value = savedThreadId;
    setTicketNumber(parseInt(localStorage.getItem('rg_ticket_seq') || '1', 10));
  } else {
    startNewSession();
  }
  pingBackend();
})();
</script>

</body>
</html>
